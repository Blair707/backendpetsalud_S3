spring.application.name=backendpetsalud

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:tu_usuario}
spring.datasource.password=${DB_PASSWORD:tu_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET:cambiar-esta-clave-en-produccion-minimo-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

seguridad.max-intentos-fallidos=5
seguridad.bloqueo-minutos=10

logging.level.com.petsalud.backendpetsalud.security=INFO
